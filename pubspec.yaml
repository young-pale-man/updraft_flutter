name: updraft_flutter
description: "A one-button flight game about knowing when to jump."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  shared_preferences: ^2.5.6
  rive: ^0.14.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/

  fonts:
    - family: Bungee
      fonts:
        - asset: fonts/Bungee-Regular.ttf
    - family: Rubik
      fonts:
        - asset: fonts/Rubik-Variable.ttf
