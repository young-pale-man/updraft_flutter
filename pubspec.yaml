name: updraft_flutter
description: "A one-button flight game about knowing when to jump."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  intl: ^0.20.3

  shared_preferences: ^2.5.6

  flutter_svg: ^2.3.0
  flutter_bounce: ^1.1.0
  flutter_spinkit: ^5.2.2
  stroke_text: ^1.0.0
  percent_indicator: ^4.2.5

  rive: ^0.14.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Bungee
      fonts:
        - asset: fonts/Bungee-Regular.ttf
    - family: Rubik
      fonts:
        - asset: fonts/Rubik-Variable.ttf
